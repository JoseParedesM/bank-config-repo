server:
  port: 8080

security:
  jwt:
    secret-base64: ${JWT_SECRET_BASE64}
    issuer: bank-bootcamp
    audience: bank-api

spring:
  cloud:
    gateway:
      server:
        webflux:
          discovery:
            locator:
              enabled: false
          routes:
            - id: client-service
              uri: lb://CLIENT-SERVICE
              predicates:
                - Path=/api/clients/**
              filters:
                - name: CircuitBreaker
                  args:
                    name: clientCircuitBreaker
                    fallbackUri: forward:/fallback/client
            
            - id: bank-account-service
              uri: lb://BANK-ACCOUNT-SERVICE
              predicates:
                - Path=/api/bank-accounts/**
              filters:
                - name: CircuitBreaker
                  args:
                    name: bankAccountCircuitBreaker
                    fallbackUri: forward:/fallback/bankAccount
            
            - id: credit-service
              uri: lb://CREDIT-SERVICE
              predicates:
                - Path=/api/credits/**
              filters:
                - name: CircuitBreaker
                  args:
                    name: creditCircuitBreaker
                    fallbackUri: forward:/fallback/credit
            
            - id: transaction-service
              uri: lb://TRANSACTION-SERVICE
              predicates:
                - Path=/api/transactions/**
              filters:
                - name: CircuitBreaker
                  args:
                    name: transactionCircuitBreaker
                    fallbackUri: forward:/fallback/transaction

            - id: yanki-service
              uri: lb://YANKI-SERVICE
              predicates:
                - Path=/api/yanki/**
              filters:
                - name: CircuitBreaker
                  args:
                    name: yankiCircuitBreaker
                    fallbackUri: forward:/fallback/yanki

# Configuración obligatoria del Circuit Breaker (Timeout de 2 segundos)
resilience4j:
  circuitbreaker:
    configs:
      default:
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 3
    instances:
      clientCircuitBreaker:
        baseConfig: default
      bankAccountCircuitBreaker:
        baseConfig: default
      creditCircuitBreaker:
        baseConfig: default
      transactionCircuitBreaker:
        baseConfig: default
      yankiCircuitBreaker:
        baseConfig: default
  timelimiter:
    configs:
      default:
        timeoutDuration: 2s # <-- Requisito del documento cumplido
    instances:
      clientCircuitBreaker:
        baseConfig: default
      bankAccountCircuitBreaker:
        baseConfig: default
      creditCircuitBreaker:
        baseConfig: default
      transactionCircuitBreaker:
        baseConfig: default
      yankiCircuitBreaker:
        baseConfig: default

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/