server:
  port: 8080

spring:
  cloud:
    gateway:
      discovery:
        locator:
          enabled: false
          lower-case-service-id: true
      routes:
        - id: client-service
          uri: lb://client-service
          predicates:
            - Path=/api/clients, /api/clients/**
            
        - id: bank-account-service
          uri: lb://bank-account-service
          predicates:
            - Path=/api/bank-accounts, /api/bank-accounts/**
            
        - id: credit-service
          uri: lb://credit-service
          predicates:
            - Path=/api/credits, /api/credits/**
            
        - id: transaction-service
          uri: lb://transaction-service
          predicates:
            - Path=/api/transactions, /api/transactions/**

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true