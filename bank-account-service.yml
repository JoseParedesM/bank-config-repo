server:
  port: 8082

spring:
  data:
    mongodb:
      uri: mongodb://localhost:27017
      database: bank_account_db

bank-account:
  minimum-opening-amount: 0
  transaction:
    max-free-per-month: 20
    commission-per-excess: 2.00
  vip:
    minimum-average-daily-balance: 0

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true