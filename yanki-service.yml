server:
  port: 8085

security:
  jwt:
    secret-base64: ${JWT_SECRET_BASE64}
    issuer: bank-bootcamp
    audience: bank-api

spring:
  data:
    mongodb:
      uri: mongodb://localhost:27017
      database: yanki_db
      auto-index-creation: true
    redis:
      host: localhost
      port: 6379
      timeout: 2s
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: yanki-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: com.banco.yankiservice.event
yanki:
  kafka:
    payment-completed-topic: yanki.payment.completed.v1
  redis:
    wallet-phone-ttl: 10m

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true